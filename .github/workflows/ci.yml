name: DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: 🛠️ Uji Kode & Docker
    runs-on: ubuntu-latest

    # 🐘 Sedia database PostgreSQL otomatis khusus untuk testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: rahasia123
          POSTGRES_DB: devops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Automated API Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://admin:rahasia123@localhost:5432/devops_db

      - name: 🐳 Test Docker Build
        run: docker build -t devops-app-test .

  # ==========================================
  # JOB 2: DEPLOYMENT (CD)
  # ==========================================
  deploy:
    name: 🚀 Deploy ke Railway
    needs: test-and-build # 👈 Wajib lulus test (CI) dulu baru boleh jalan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # 👈 Hanya jalan saat merge ke main
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Railway CLI & Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service devops-microservice